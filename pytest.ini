[pytest]
# Pytest configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show detailed output
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=backend
    --cov=src/accessibility_ai
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=40
